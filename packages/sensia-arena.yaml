external_components:
  - source: github://Aulos/esphome-sensia-arena@main
    components: [sensia_arena]
    refresh: 0s

sensia_arena:

substitutions:
  # Used only until the first status. See README.md before enabling replies.
  initial_settings: "0x06"
  timezone: "Europe/Warsaw"

esphome:
  name: sensia-arena
  friendly_name: Sensia Arena
  min_version: 2026.9.1
  platformio_options:
    build_flags:
      - -DESPHOME_ESP32_BLE_GAP_EVENT_HANDLER_COUNT=1
  on_boot:
    priority: -100
    then:
    - lambda: |-
        sensia::session.settings = ${initial_settings};
        id(ble_connected).publish_state(false);
        id(protocol_status).publish_state("Waiting for toilet");
        esp32_ble::global_ble->add_gap_event_callback([](esp_gap_ble_cb_event_t event, esp_ble_gap_cb_param_t *param) {
          if (event == ESP_GAP_BLE_SEC_REQ_EVT) {
            const bool accept = id(pairing_replies).state;
            auto result = esp_ble_gap_security_rsp(param->ble_security.ble_req.bd_addr, accept);
            ESP_LOGW("sensia", "BLE security request: accept=%d result=%d", accept, result);
          } else if (event == ESP_GAP_BLE_AUTH_CMPL_EVT) {
            ESP_LOGW("sensia", "BLE authentication: success=%d reason=0x%02x", param->ble_security.auth_cmpl.success, param->ble_security.auth_cmpl.fail_reason);
          }
        });

esp32:
  # Waveshare ESP32-C3-Zero
  variant: esp32c3
  flash_size: 4MB
  framework:
    type: esp-idf

logger:
  level: DEBUG

time:
  - platform: homeassistant
    id: local_time
    timezone: ${timezone}

globals:
  - id: command_waiting
    type: bool
    initial_value: 'false'
  - id: command_action
    type: int
    initial_value: '0'
  - id: command_status_before
    type: int
    initial_value: '-1' 
  - id: last_status_ms
    type: uint32_t
    restore_value: false
    initial_value: '0'

esp32_ble:
  name: LIXIL
  auth_req_mode: bond
  max_connections: 1

esp32_ble_server:
  max_clients: 1
  on_connect:
    - lambda: |-
        id(command_waiting) = false;
        sensia::session = sensia::Session{};
        sensia::session.settings = ${initial_settings};
        id(ble_connected).publish_state(true);
        id(protocol_status).publish_state("BLE connected; awaiting packets");
  on_disconnect:
    - lambda: |-
        id(command_waiting) = false;
        sensia::session = sensia::Session{};
        sensia::session.settings = ${initial_settings};
        id(ble_connected).publish_state(false);
        id(occupied).invalidate_state();
        id(model_code).publish_state(NAN);
        id(protocol_status).publish_state("Disconnected");
  services:
    - uuid: 6e400001-b5a3-f393-e0a9-e50e24dcca9e
      advertise: true
      characteristics:
        - id: toilet_tx
          uuid: 6e400003-b5a3-f393-e0a9-e50e24dcca9e
          write: true
          notify: true
          descriptors:
            - uuid: "2902"
              read: true
              write: true
              value: [0, 0]
        - uuid: 6e400002-b5a3-f393-e0a9-e50e24dcca9e
          write: true
          write_no_response: true
          on_write:
            - lambda: |-
                ESP_LOGD("sensia", "RX %s", format_hex_pretty(x.data(), x.size()).c_str());
                auto kind = sensia::session.receive(x.data(), x.size());
                if (kind == sensia::Packet::INVALID) {
                  ESP_LOGW("sensia", "Ignored packet of %u bytes", unsigned(x.size()));
                  return;
                }
                if (kind == sensia::Packet::PAIRING) {
                  id(protocol_status).publish_state("Pairing packet received");
                } else {
                  id(last_status_ms) = millis();
                  if (sensia::session.observed(static_cast<sensia::Action>(id(command_action))) != id(command_status_before)) id(command_waiting) = false;
                  id(occupied).publish_state(sensia::session.occupied);
                  id(model_code).publish_state(sensia::session.model);
                  id(protocol_status).publish_state(sensia::session.known_model() ? "Status received" : "Unknown variant; monitoring only");
                }

switch:
  - platform: template
    id: pairing_replies
    name: Enable pairing replies
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF

