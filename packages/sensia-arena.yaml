# Native Sensia Arena component. Keep entity names unchanged during migration.
external_components:
- source: github://Aulos/esphome-sensia-arena@${sensia_component_ref}
  components:
  - sensia_arena
  refresh: 0s
substitutions:
  sensia_component_ref: v0.1.0
  initial_settings: '0x06'
  timezone: Europe/Warsaw
esphome:
  name: sensia-arena
  friendly_name: Sensia Arena
  min_version: 2026.9.1
esp32:
  variant: esp32c3
  flash_size: 4MB
  framework:
    type: esp-idf
logger:
  level: DEBUG
time:
- platform: homeassistant
  id: local_time
  timezone: ${timezone}
esp32_ble:
  name: LIXIL
  auth_req_mode: bond
  max_connections: 1
esp32_ble_server:
  max_clients: 1
sensia_arena:
  id: sensia_hub
  time_id: local_time
  initial_settings: ${initial_settings}
switch:
- platform: sensia_arena
  id: pairing_replies
  name: Enable pairing replies
  entity_category: config
  type: PAIRING_REPLIES
- platform: sensia_arena
  id: maintenance
  name: Enable maintenance commands
  entity_category: config
  type: MAINTENANCE
- platform: sensia_arena
  id: auto_lid
  name: Automatic lid
  entity_category: config
  type: AUTO_LID
- platform: sensia_arena
  id: deodorizer
  name: Automatic deodorizer
  entity_category: config
  type: DEODORIZER
- platform: sensia_arena
  id: blue_led
  name: Blue LED
  entity_category: config
  type: BLUE_LED
- platform: sensia_arena
  id: operation_sound
  name: Operation sound
  entity_category: config
  type: SOUND
- platform: sensia_arena
  id: prewash
  name: Pre-wash
  entity_category: config
  type: PREWASH
- platform: sensia_arena
  id: auto_flush
  name: Automatic flushing
  entity_category: config
  type: AUTO_FLUSH
- platform: sensia_arena
  id: power_saving
  name: Power saving
  entity_category: config
  type: POWER_SAVE
- platform: sensia_arena
  id: heater_auto_off
  name: Seat heater automatic off
  entity_category: config
  type: HEATER_OFF
- platform: sensia_arena
  id: freeze
  name: Freeze protection
  entity_category: config
  type: FREEZE
binary_sensor:
- platform: sensia_arena
  id: ble_connected
  name: Toilet BLE connection
  device_class: connectivity
  type: CONNECTION
- platform: sensia_arena
  id: occupied
  name: Seat occupied
  device_class: occupancy
  type: OCCUPIED
- platform: sensia_arena
  name: Descaling recommended
  entity_category: diagnostic
  type: DESCALING_RECOMMENDED
- platform: sensia_arena
  name: Descaling active
  entity_category: diagnostic
  type: DESCALING_ACTIVE
- platform: sensia_arena
  name: Descaling drainage error
  entity_category: diagnostic
  type: DESCALING_ERROR
- platform: sensia_arena
  name: Setting change pending
  entity_category: diagnostic
  type: PENDING
- platform: sensia_arena
  name: Motorized lid supported
  entity_category: diagnostic
  type: MOTORIZED_LID_SUPPORTED
- platform: sensia_arena
  name: Seat heating supported
  entity_category: diagnostic
  type: SEAT_HEATING_SUPPORTED
- platform: sensia_arena
  name: Descaling supported
  entity_category: diagnostic
  type: DESCALING_SUPPORTED
- platform: sensia_arena
  name: Ion and blue LED supported
  entity_category: diagnostic
  type: ION_SUPPORTED
sensor:
- platform: sensia_arena
  id: model_code
  name: Reported model code
  entity_category: diagnostic
  accuracy_decimals: 0
  type: MODEL
- platform: sensia_arena
  name: Reported grade code
  entity_category: diagnostic
  accuracy_decimals: 0
  type: GRADE
- platform: sensia_arena
  name: Reported region code
  entity_category: diagnostic
  accuracy_decimals: 0
  type: REGION
- platform: sensia_arena
  name: Flush delay
  entity_category: diagnostic
  accuracy_decimals: 0
  type: FLUSH_DELAY
- platform: sensia_arena
  name: Reported ion mode
  entity_category: diagnostic
  accuracy_decimals: 0
