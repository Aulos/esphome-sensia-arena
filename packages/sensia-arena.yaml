select:
  - platform: template
    name: Seat temperature
    id: seat_temperature
    entity_category: config
    options: ["Off", "28 °C", "30 °C", "32 °C", "34 °C", "36 °C"]
    update_interval: 1s
    lambda: |-
      if (!sensia::session.supports(sensia::Action::SEAT_TEMP)) return {};
      constexpr uint8_t codes[] = {0,1,3,5,6,7};
      const char *labels[] = {"Off", "28 °C", "30 °C", "32 °C", "34 °C", "36 °C"};
      for (int i = 0; i < 6; ++i)
        if (codes[i] == (sensia::session.status[13] >> 5)) return std::string(labels[i]);
      return {};
    set_action:
      - script.execute:
          id: send_command
          action: !lambda return int(sensia::Action::SEAT_TEMP);
          value: !lambda return int(id(seat_temperature).index_of(x).value_or(99));
