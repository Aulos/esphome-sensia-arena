    lambda: |-
      if (!sensia::session.supports(sensia::Action::AUTO_LID)) return {};
      return bool(sensia::session.setting(sensia::Action::AUTO_LID));
    turn_on_action:
      - script.execute:
          id: send_command
          action: !lambda return int(sensia::Action::AUTO_LID);
          value: 1
    turn_off_action:
