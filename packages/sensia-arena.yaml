  type: SEAT_TEMPERATURE_CODE
- platform: sensia_arena
  name: Abnormal status code
  entity_category: diagnostic
  accuracy_decimals: 0
  type: ABNORMAL_STATUS
text_sensor:
- platform: sensia_arena
  id: protocol_status
  name: Protocol status
  entity_category: diagnostic
number:
- platform: sensia_arena
  id: wash_pressure
  name: Wash pressure
  type: PRESSURE
- platform: sensia_arena
  id: water_level
  name: Water temperature level
  type: WATER
- platform: sensia_arena
  id: wash_width
  name: Wash width
  type: WIDTH
- platform: sensia_arena
  id: nozzle_position
