  type: FRONT
- platform: sensia_arena
  name: Dryer
  type: DRY
- platform: sensia_arena
  name: Clean nozzle
  type: CLEAN_NOZZLE
- platform: sensia_arena
  name: Clean rear nozzle
  type: CLEAN_REAR
- platform: sensia_arena
  name: Clean front nozzle
  type: CLEAN_FRONT
- platform: sensia_arena
  name: Clean nozzle guard
  type: CLEAN_GUARD
- platform: sensia_arena
  name: Cycle ion mode
  type: ION_CYCLE
- platform: sensia_arena
  name: Cycle flush delay
  type: DELAY_CYCLE
- platform: sensia_arena
