binary_sensor:
  - platform: template
    id: ble_connected
    name: Toilet BLE connection
    device_class: connectivity
  - platform: template
    id: occupied
    name: Seat occupied
    device_class: occupancy

  - platform: template
    name: Descaling recommended
    entity_category: diagnostic
    lambda: |-
      if (!sensia::session.supports(sensia::Action::DESCALE)) return {};
      return bool(sensia::session.status[5] & 1);
  - platform: template
    name: Descaling active
    entity_category: diagnostic
    lambda: |-
      if (!sensia::session.supports(sensia::Action::DESCALE)) return {};
      return bool(sensia::session.status[5] & 2);
  - platform: template
    name: Descaling drainage error
    entity_category: diagnostic
    lambda: |-
      if (!sensia::session.supports(sensia::Action::DESCALE)) return {};
      return bool(sensia::session.status[5] & 4);

  - platform: template
    name: Setting change pending
    entity_category: diagnostic
    lambda: return id(command_waiting);
  - platform: template
    name: Motorized lid supported
    entity_category: diagnostic
    lambda: |-
      if (!sensia::session.have_status) return {};
      return sensia::session.supports(sensia::Action::OPEN_LID);
  - platform: template
    name: Seat heating supported
    entity_category: diagnostic
    lambda: |-
      if (!sensia::session.have_status) return {};
      return sensia::session.supports(sensia::Action::SEAT_TEMP);
  - platform: template
    name: Descaling supported
    entity_category: diagnostic
    lambda: |-
      if (!sensia::session.have_status) return {};
      return sensia::session.supports(sensia::Action::DESCALE);
  - platform: template
    name: Ion and blue LED supported
    entity_category: diagnostic
    lambda: |-
      if (!sensia::session.have_status) return {};
      return sensia::session.supports(sensia::Action::ION_CYCLE);

sensor:
  - platform: template
    id: model_code
    name: Reported model code
    entity_category: diagnostic
    accuracy_decimals: 0
    update_interval: never

  - platform: template
    name: Reported grade code
    entity_category: diagnostic
    accuracy_decimals: 0
    update_interval: 1s
    lambda: |-
      if (!sensia::session.have_status) return NAN;
      return sensia::session.grade;
  - platform: template
    name: Reported region code
    entity_category: diagnostic
    accuracy_decimals: 0
    update_interval: 1s
    lambda: |-
      if (!sensia::session.have_status) return NAN;
      return sensia::session.region;
  - platform: template
    name: Flush delay
    entity_category: diagnostic
    accuracy_decimals: 0
    update_interval: 1s
    lambda: |-
      if (!sensia::session.have_status) return NAN;
      return (std::array<int,4>{2,6,10,15})[(sensia::session.status[11] >> 5) & 3];
  - platform: template
    name: Reported ion mode
    entity_category: diagnostic
    accuracy_decimals: 0
    update_interval: 1s
    lambda: |-
      if (!sensia::session.have_status) return NAN;
      return (sensia::session.status[17] >> 4) & 3;
  - platform: template
    name: Reported seat temperature code
    entity_category: diagnostic
    accuracy_decimals: 0
    update_interval: 1s
    lambda: |-
      if (!sensia::session.have_status) return NAN;
      return sensia::session.status[13] >> 5;
  - platform: template
    name: Abnormal status code
    entity_category: diagnostic
    accuracy_decimals: 0
    update_interval: 1s
    lambda: |-
      if (!sensia::session.have_status) return NAN;
      return sensia::session.status[14] & 15;

text_sensor:
  - platform: template
    id: protocol_status
    name: Protocol status
    entity_category: diagnostic
    update_interval: never

interval:
  - interval: 250ms
    then:
      - if:
          condition:
            lambda: |-
              return id(pairing_replies).state && sensia::session.pending_reply &&
                     id(local_time).now().is_valid();
          then:
            - ble_server.characteristic.set_value:
                id: toilet_tx
                value: !lambda |-
                  auto now = id(local_time).now();
                  return sensia::session.reply(now.month, now.day_of_month, now.hour, now.minute);
            - ble_server.characteristic.notify:
                id: toilet_tx
            - lambda: |-
                sensia::session.pending_reply = false;
                ESP_LOGI("sensia", "Sent opcode 00, phase %u, settings 0x%02X",
                         sensia::session.phase, sensia::session.settings | 1);

script:
  - id: send_command
    parameters:
      action: int
      value: int
    then:
      - lambda: |-
          auto a = static_cast<sensia::Action>(action);
          if (!id(ble_connected).state || !id(pairing_replies).state || !id(local_time).now().is_valid()) {
            ESP_LOGW("sensia", "Command rejected: connection, replies, or clock unavailable");
            return;
          }
          if (sensia::session.observed(a) >= 0 && id(command_waiting)) {
            ESP_LOGW("sensia", "Command rejected: waiting for changed status or reconnect");
            return;
          }
          sensia::WashProfile w;
          w.pressure = int(id(wash_pressure).state) - 1;
          w.water = int(id(water_level).state);
          w.width = int(id(wash_width).state) - 1;
          w.position = int(id(nozzle_position).state) - 1;
          w.massage = int(id(massage_mode).state);
          auto now = id(local_time).now();
          auto p = sensia::session.command(a, value, w, now.month, now.day_of_month,
                                          now.hour, now.minute, id(maintenance).state);
          if (p.empty()) {
            ESP_LOGW("sensia", "Command rejected: unsupported, unchanged, or precondition unmet");
            return;
          }
          const auto opcode = p[1];
          id(toilet_tx)->set_value(std::move(p));
          id(toilet_tx)->notify();
          // Toggle commands must not be repeated against stale status.
          if (sensia::session.setting(a) >= 0 || a == sensia::Action::ION_CYCLE ||
              a == sensia::Action::DELAY_CYCLE || a == sensia::Action::SEAT_TEMP) {
            id(command_waiting) = true;
            id(command_action) = action;
            id(command_status_before) = sensia::session.observed(a);
          }
          ESP_LOGI("sensia", "Sent command opcode %02X", opcode);

