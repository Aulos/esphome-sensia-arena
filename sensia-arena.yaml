# Keep credentials local. The package supplies the BLE protocol and controls.
packages:
  sensia_arena: github://Aulos/esphome-sensia-arena/packages/sensia-arena.yaml@main

substitutions:
  timezone: Europe/Warsaw
  initial_settings: "0x06"

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

