# Keep credentials local. The package supplies the BLE protocol and controls.
packages:
  sensia_arena:
    url: https://github.com/Aulos/esphome-sensia-arena
    ref: main
    refresh: always
    files: [packages/sensia-arena.yaml]

substitutions:
  timezone: Europe/Warsaw
  initial_settings: "0x06"

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

